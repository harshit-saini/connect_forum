<title>GACS Guidance Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky-free single column; branded gradient header, proto banner, role views in cards. Palette: Axtria-style blues with orange for action/attention. */
:root{--navy:#003760;--ocean:#005A89;--azure:#14B0E6;--green:#3A9848;--orange:#F36F21;--gray:#3F3F3F;--mid:#5F6A70;--line:#DCE3E4;--bg:#F5F7FA;--card:#FFFFFF;--tint:#FEF3EC;--sel:#EBF5FB;--bgray:#6B7378;--errbg:#FDECEA;--errbd:#D93025;--errfg:#8A1C13;--okbg:#EAF6EC;--okfg:#1F5F2B;--shade:rgba(0,55,96,.55)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--navy:#9FD3F2;--ocean:#1C7DB0;--azure:#3CC0EE;--green:#4FB35D;--orange:#FF8A4C;--gray:#D5DBE0;--mid:#9AA5AB;--line:#2C3B46;--bg:#0F1A22;--card:#16242E;--tint:#2A1F18;--sel:#12303F;--errbg:#3A1B18;--errbd:#E5594D;--errfg:#F5B4AE;--okbg:#16301B;--okfg:#A8E0B1;--shade:rgba(0,0,0,.65);color-scheme:dark}}
:root[data-theme="dark"]{--navy:#9FD3F2;--ocean:#1C7DB0;--azure:#3CC0EE;--green:#4FB35D;--orange:#FF8A4C;--gray:#D5DBE0;--mid:#9AA5AB;--line:#2C3B46;--bg:#0F1A22;--card:#16242E;--tint:#2A1F18;--sel:#12303F;--errbg:#3A1B18;--errbd:#E5594D;--errfg:#F5B4AE;--okbg:#16301B;--okfg:#A8E0B1;--shade:rgba(0,0,0,.65);color-scheme:dark}
*{box-sizing:border-box}
body{font-family:Aptos,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;color:var(--gray);background:var(--bg);min-height:100vh}
header{background:linear-gradient(90deg,#005A89,#236E63,#3A9848);color:#fff;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;color:#fff}
header .demo{background:rgba(255,255,255,.22);border-radius:99px;padding:2px 10px;font-size:12px}
header .sp{flex:1}
header a{text-decoration:none}
.brand{display:flex;align-items:center}
.logo{background:#fff;border-radius:8px;padding:4px 8px;display:flex;align-items:center}
.logo img{height:54px;width:auto;display:block}
.logo .mark{color:#003760;font-size:21px;letter-spacing:2px}
header .home{color:#fff;border:1px solid rgba(255,255,255,.7);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex:none}
header .home:hover{background:rgba(255,255,255,.2)}
.chip{background:#fff;color:#003760;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.proto{background:var(--tint);color:var(--navy);border-bottom:1px solid var(--orange);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px}
main{max-width:1050px;margin:24px auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{color:var(--navy);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mid);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:800px){.g2,.g4{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:10px 0 4px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--gray)}
textarea{min-height:80px;resize:vertical}
button{font:inherit;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--ocean);color:#fff}
button.sec{background:transparent;color:var(--navy);border:1px solid var(--ocean)}
button.org{background:#C4560F}button.grn{background:#2F7D3B}
button.link{background:none;color:var(--navy);padding:4px 0;text-decoration:underline}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--azure);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;color:var(--gray);border-radius:8px 8px 0 0;padding:10px 16px}
.tab.on{background:var(--card);color:var(--navy);border:1px solid var(--line);border-bottom-color:var(--card);margin-bottom:-1px}
.cat{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--card)}
.cat.on{border-color:var(--azure);background:var(--sel)}
.cat b{display:block;color:var(--navy)}.cat span{font-size:13px;color:var(--mid)}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff}
.b-submitted,.b-pending,.b-unmatched,.b-rejected{background:var(--bgray)}.b-matched{background:#0F7FA8}.b-scheduled{background:#C4560F}.b-completed,.b-approved,.b-active{background:#2F7D3B}
.steps{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.step{flex:1;min-width:70px;text-align:center;font-size:12px;padding:6px 2px;border-radius:6px;background:var(--bg);color:var(--mid);font-weight:600;border:1px solid var(--line)}
.step.done{background:#2F7D3B;color:#fff;border-color:#2F7D3B}.step.cur{background:#C4560F;color:#fff;border-color:#C4560F}
.note{background:var(--tint);border:1px solid var(--orange);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--navy)}
.err{background:var(--errbg);border:1px solid var(--errbd);color:var(--errfg);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
.ok{background:var(--okbg);border:1px solid var(--green);color:var(--okfg);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{background:var(--ocean);color:#fff;text-align:left;padding:8px}td{padding:8px;border-bottom:1px solid var(--line)}
tr:nth-child(even) td{background:var(--bg)}
.stars{color:var(--orange);letter-spacing:2px}
.rate button{background:var(--card);color:var(--mid);border:1px solid var(--line);font-size:20px;padding:4px 10px}
.rate button.on{color:var(--orange);border-color:var(--orange)}
.modal{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--card);border-radius:12px;padding:24px;max-width:460px;width:100%}
.zoom{background:#0B5CFF;color:#fff;border-radius:10px;padding:18px;text-align:center}
.small{font-size:13px;color:var(--mid)}
.login{max-width:520px;margin:30px auto}
.demoacc{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.demoacc button{text-align:left;background:var(--bg);color:var(--navy);border:1px solid var(--line);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

let DB=load();
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
let session=(()=>{try{return sessionStorage.getItem('gacs_session')}catch(e){return null}})();
function setSession(id){session=id;try{id?sessionStorage.setItem('gacs_session',id):sessionStorage.removeItem('gacs_session')}catch(e){}}

/* ---------- Business rules ---------- */
const member=id=>DB.members.find(m=>m.id===id);
const isActiveMember=id=>{const m=member(id);return !!m&&m.status==='active'};
const isGuide=id=>{const p=DB.profiles[id];return !!p&&p.categories.length>0&&isActiveMember(id)};
function guideStats(gid){
  const fb=DB.queries.filter(q=>q.guideId===gid&&q.feedback);
  return {count:fb.length,avg:fb.length?fb.reduce((a,q)=>a+q.feedback.rating,0)/fb.length:0};
}
const activeLoad=gid=>DB.queries.filter(q=>q.guideId===gid&&['matched','scheduled'].includes(q.status)).length;
function matchGuide(category,excludeId){
  const cands=DB.members.filter(m=>m.id!==excludeId&&isGuide(m.id)&&DB.profiles[m.id].categories.includes(category));
  if(!cands.length)return null;
  cands.sort((a,b)=>activeLoad(a.id)-activeLoad(b.id)||guideStats(b.id).avg-guideStats(a.id).avg);
  return cands[0].id;
}
function rematchWaiting(){
  DB.queries.filter(q=>q.status==='unmatched').forEach(q=>{const g=matchGuide(q.category,q.seekerId);if(g){q.guideId=g;q.status='matched'}});
}
function submitQuery(seekerId,category,title,details){
  if(!isActiveMember(seekerId)||member(seekerId).role!=='member')return {error:'A valid member ID is required to ask for guidance.'};
  if(!category||!title.trim())return {error:'Choose a category and add a short title.'};
  const q={id:'Q-'+String(++DB.seq.q).padStart(4,'0'),seekerId,category,title:title.trim(),details:details.trim(),guideId:null,status:'submitted',zoom:null,feedback:null,created:now()};
  const g=matchGuide(category,seekerId);
  if(g){q.guideId=g;q.status='matched'}else q.status='unmatched';
  DB.queries.unshift(q);save();return {q};
}
function attendQuery(guideId,qid){
  if(!isGuide(guideId))return {error:'Create a Guide profile to extend guidance.'};
  const q=DB.queries.find(x=>x.id===qid);
  if(!q||q.guideId!==guideId||q.status!=='matched')return {error:'Query not available.'};
  const n=()=>Math.floor(1e9+Math.random()*9e9);
  q.zoom={link:'https://zoom.us/j/'+n(),passcode:String(Math.floor(1e5+Math.random()*9e5)),time:now()};
  q.status='scheduled';save();return {q};
}
function completeQuery(qid){const q=DB.queries.find(x=>x.id===qid);if(q&&q.status==='scheduled'){q.status='completed';save()}}
function giveFeedback(qid,rating,comment){
  const q=DB.queries.find(x=>x.id===qid);
  if(!q||q.status!=='completed')return {error:'Feedback opens after the discussion is completed.'};
  if(!rating)return {error:'Please choose a rating from 1 to 5.'};
  q.feedback={rating,comment:comment.trim(),time:now()};save();return {q};
}
function saveGuideProfile(id,headline,intro,resume,categories){
  if(!isActiveMember(id))return {error:'A valid member ID is required.'};
  if(!categories.length)return {error:'Choose at least one problem category you can help with.'};
  const prev=DB.profiles[id]||{resume:''};
  const wasGuide=isGuide(id);
  DB.profiles[id]={headline:headline.trim(),intro:intro.trim(),resume:resume||prev.resume||'',categories:categories.slice()};
  rematchWaiting();save();return {firstTime:!wasGuide};
}
function applyMembership(name,email){
  if(!name.trim()||!/\S+@\S+\.\S+/.test(email))return {error:'Enter your name and a valid email.'};
  const a={id:'APP-'+String(++DB.seq.app).padStart(4,'0'),name:name.trim(),email:email.trim(),status:'pending',created:now()};
  DB.applications.push(a);save();return {a};
}
function decideApplication(id,approve){
  const a=DB.applications.find(x=>x.id===id);if(!a||a.status!=='pending')return;
  if(approve){
    const mid='GACS-'+(DB.seq.member++);
    DB.members.push({id:mid,name:a.name,email:a.email,role:'member',status:'active'});
    a.status='approved';a.memberId=mid;
  }else a.status='rejected';
  save();
}

function stepper(q){
  const order=['matched','scheduled','completed'];const labels=['Matched','Zoom scheduled','Completed'];
  const idx=q.status==='unmatched'||q.status==='submitted'?-1:order.indexOf(q.status);
  return `<div class="steps"><div class="step done">Submitted</div>${labels.map((l,i)=>`<div class="step ${i<idx||(q.feedback&&i===2)?'done':i===idx?'cur':''}">${l}</div>`).join('')}<div class="step ${q.feedback?'done':''}">Rated</div></div>`;

/* ---------- Events ---------- */
function readDraft(me){
  const p=DB.profiles[me.id]||{headline:'',intro:'',categories:[]};
  const d=ui.draft||{headline:p.headline,intro:p.intro,categories:p.categories.slice()};
  const h=$('#ph'),i=$('#pi');
  return {headline:h?h.value:d.headline,intro:i?i.value:d.intro,categories:d.categories.slice()};
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,me=session&&member(session);
  if(a!=='reset')ui.confirmReset=false;
  switch(a){
    case 'login':{const id=$('#mid').value.trim().toUpperCase();
      if(!isActiveMember(id)){ui.loginMsg='Member ID not found or not active. Non-members must request membership first.';}
      else{ui.loginMsg=null;ui.tab=null;ui.cat=null;ui.draft=null;setSession(id)}break}
    case 'quick':ui.loginMsg=null;ui.tab=null;ui.draft=null;setSession(t.dataset.id);break;
    case 'logout':setSession(null);ui.tab=null;ui.draft=null;break;
    case 'showApply':ui.showApply=true;break;
    case 'hideApply':ui.showApply=false;break;
    case 'applyReset':ui.applied=null;ui.showApply=true;break;
    case 'apply':{const r=applyMembership($('#an').value,$('#ae').value);if(r.error)flash('err',r.error);else{ui.applied=r.a;ui.showApply=false}break}
    case 'tab':ui.tab=t.dataset.t;ui.draft=null;break;
    case 'cat':ui.cat=t.dataset.c;break;
    case 'submitQ':{const r=submitQuery(me.id,ui.cat,$('#qt').value,$('#qd').value);
      if(r.error)flash('err',r.error);else{ui.cat=null;ui.tab='mine';flash('ok',r.q.status==='matched'?`Query ${r.q.id} submitted and matched to ${member(r.q.guideId).name}.`:`Query ${r.q.id} submitted. No Guide is available in this category yet.`)}break}
    case 'gcat':{const d=readDraft(me);const i=d.categories.indexOf(t.dataset.c);i>=0?d.categories.splice(i,1):d.categories.push(t.dataset.c);ui.draft=d;break}
    case 'saveProfile':{const d=readDraft(me);const file=$('#pr').files[0];
      const r=saveGuideProfile(me.id,d.headline,d.intro,file?file.name:'',d.categories);
      if(r.error){ui.draft=d;flash('err',r.error)}else{ui.draft=null;if(r.firstTime){ui.tab='inbox';flash('ok','You are now a Guide. Matching queries will appear in your Guide inbox.')}else flash('ok','Profile saved.')}break}
    case 'attend':{const r=attendQuery(me.id,t.dataset.q);if(r.error)flash('err',r.error);else flash('ok','Zoom session generated for you and the Seeker.');break}
    case 'zoom':zoomModal(DB.queries.find(x=>x.id===t.dataset.q));return;
    case 'closeModal':$('#modal').innerHTML='';return;
    case 'complete':completeQuery(t.dataset.q);flash('ok','Marked complete. The Seeker can now give feedback.');break;
    case 'rate':ui.fbRating[t.dataset.q]=+t.dataset.n;break;
    case 'feedback':{const q=t.dataset.q;const r=giveFeedback(q,ui.fbRating[q]||0,(document.getElementById('fb-'+q)||{value:''}).value);
      if(r.error)flash('err',r.error);else flash('ok','Thank you! Your rating is now on the Guide’s profile.');break}
    case 'approve':decideApplication(t.dataset.a,true);flash('ok','Approved. A member ID was issued.');break;
    case 'reject':decideApplication(t.dataset.a,false);flash('ok','Request rejected.');break;
    case 'reset':if(!ui.confirmReset){ui.confirmReset=true}else{DB=seed();save();setSession(null);ui=freshUi()}break;
  }
  render();
});
save();
if(session&&!isActiveMember(session))setSession(null);
render();
</script>
