name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: cf, POSTGRES_PASSWORD: cf, POSTGRES_DB: connect_forum_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cf" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cf:cf@localhost:5432/connect_forum_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgres://cf:cf@localhost:5432/connect_forum_test
          APP_URL: http://localhost:3000
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          CRON_SECRET: ci-cron-secret-123456
          VAULT_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          MOCK_AI: "true"
