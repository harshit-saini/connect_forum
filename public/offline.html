<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<title>You're offline · Connect</title>
<style>
  :root { color-scheme: light dark; --bg:#f8faf9; --fg:#14211f; --muted:#5b6b68; --primary:#0f766e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1514; --fg:#e8f0ee; --muted:#9db0ac; --primary:#2dd4bf; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; box-sizing:border-box; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:26rem; text-align:center; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; }
  p { color:var(--muted); margin:0 0 1.25rem; }
  button { min-height:44px; padding:0 1.25rem; border:0; border-radius:10px; background:var(--primary); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#04201d; } }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Connect needs a connection to show your matches and requests. For your privacy, nothing personal is stored on this device. Please reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
